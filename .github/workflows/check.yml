name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    # The job is a few seconds of bash and python3 - the 1 vCPU container runner starts
    # faster and cheaper than the 4 vCPU VM, and it has everything these steps need
    # (bash, python3, coreutils, findutils; the scripts deliberately avoid awk/sed/diff).
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The cr-* lenses are canonical in skills/cr/references/lenses/ and ship inside the
      # skill, because a skill installer copies the skill directory and nothing outside it.
      - name: Shell scripts parse
        run: |
          bash -n skills/cr/scripts/lens-dir.sh

      - name: Lens resolver finds the bundled copy
        run: test "$(bash skills/cr/scripts/lens-dir.sh)" = "$PWD/skills/cr/references/lenses"

      - name: The bundled lenses are complete
        run: |
          lens_dir="$(bash skills/cr/scripts/lens-dir.sh)"
          test -f "$lens_dir/cr-verifier.md"
          test "$(find "$lens_dir" -name 'cr-*.md' | wc -l)" -ge 11

      - name: SKILL.md files match the Agent Skills spec
        run: python3 scripts/check-skills.py
